services:
  pg:
    image: pgvector/pgvector:pg16
    container_name: note_rag_pg
    environment:
      POSTGRES_USER: note_rag
      POSTGRES_PASSWORD: note_rag
      POSTGRES_DB: note_rag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U note_rag -d note_rag"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: note_rag_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    container_name: note_rag_app
    profiles: ["full"]          # 日常开发只起 pg/redis，用 `docker compose --profile full up`
    env_file: .env
    environment:
      NOTE_RAG_DATABASE_URL: postgresql://note_rag:note_rag@pg:5432/note_rag
      NOTE_RAG_REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      pg:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["note-rag", "serve", "--host", "0.0.0.0", "--port", "8000"]

volumes:
  pgdata:
